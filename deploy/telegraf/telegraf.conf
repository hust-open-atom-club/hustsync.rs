# Pulls the metric groups and takes pushes on :8186; writes everything to InfluxDB.
[agent]
  interval = "30s"
  flush_interval = "10s"

[[inputs.prometheus]]
  urls = [
    "http://manager:14242/metrics/mirrors",
    "http://manager:14242/metrics/workers",
    "http://manager:14242/metrics/syncs",
    "http://worker:6000/metrics/jobs",
    "http://worker:6000/metrics/manager",
  ]
  metric_version = 2

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/telegraf"]
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8181"]
  # InfluxDB runs without auth here but still wants a well-formed header.
  token = "hustsync"
  organization = ""
  bucket = "hustsync"
