[global]
name = "worker"
log_dir = "/var/log/hustsync/{{.Name}}"
mirror_dir = "/srv/mirror"
concurrent = 10
interval = 120

[manager]
api_base = "http://localhost:14242"

[server]
hostname = "localhost"
listen_addr = "127.0.0.1"
listen_port = 6000

[docker]
enable = true
options = ["--init"]

[[mirrors]]
name = "crates"
provider = "command"
upstream = "https://crates.io/api/v1/crates"
command = "/usr/local/bin/panamax sync /mirror"
docker_image = "panamaxrs/panamax"
docker_volumes = ["/srv/mirror/crates:/mirror"]
docker_options = ["--entrypoint="]
memory_limit = "2G"
