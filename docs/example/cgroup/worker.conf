[global]
name = "worker"
log_dir = "/var/log/hustsync/{{.Name}}"
mirror_dir = "/srv/mirror"
concurrent = 10
interval = 120

[manager]
api_base = "http://localhost:14242"

[server]
hostname = "localhost"
listen_addr = "127.0.0.1"
listen_port = 6000

[cgroup]
enable = true
base_path = "/sys/fs/cgroup"

[[mirrors]]
name = "debian"
provider = "two-stage-rsync"
stage1_profile = "debian"
upstream = "rsync://mirrors.tuna.tsinghua.edu.cn/debian/"
memory_limit = "512M"

[[mirrors]]
name = "pypi"
provider = "command"
upstream = "https://pypi.org/"
command = "/usr/local/bin/bandersnatch mirror"
memory_limit = "4G"
