[global]
name = "worker"
log_dir = "/var/log/hustsync/{{.Name}}"
mirror_dir = "/srv/mirror"
concurrent = 10
interval = 120
log_retention = 20

[manager]
api_base = "http://localhost:14242"

[server]
hostname = "localhost"
listen_addr = "127.0.0.1"
listen_port = 6000

[[mirrors]]
name = "debian"
provider = "ftpsync"
upstream = "rsync://ftp.debian.org/debian/"
cron = "0 */6 * * *"
ftpsync_conf = ["MIRRORNAME='mirrors.example.edu.cn'", "ARCH_EXCLUDE='source'"]

[[mirrors]]
name = "debian-security"
provider = "ftpsync"
upstream = "security.debian.org::debian-security"
cron = "30 */2 * * *"
