# Manager, worker and the hust-mirrors site; /status.json is served from the manager's /jobs.
# `--profile monitoring` adds the stack in docs/guide/monitoring.md.
name: hustsync

services:
  manager:
    image: hustsync
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    command: hustsync manager --config /etc/hustsync/manager.toml
    volumes:
      - ./manager.toml:/etc/hustsync/manager.toml:ro
      - db:/var/lib/hustsync
    restart: unless-stopped

  worker:
    image: hustsync
    command: hustsync worker --config /etc/hustsync/worker.toml
    volumes:
      - ./worker.toml:/etc/hustsync/worker.toml:ro
      - data:/srv/mirror
      - log:/var/log/hustsync
    depends_on: [manager]
    restart: unless-stopped

  web:
    image: hust-mirrors
    build: https://github.com/hust-open-atom-club/hust-mirrors.git#master
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - data:/srv/mirror:ro
    depends_on: [manager, web]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - p8s:/prometheus
    restart: unless-stopped

volumes:
  db:
  data:
  log:
  p8s:
