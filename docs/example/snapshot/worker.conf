[global]
name = "worker"
log_dir = "/var/log/hustsync/{{.Name}}"
mirror_dir = "/srv/sync"
concurrent = 10
interval = 120

[manager]
api_base = "http://localhost:14242"

[server]
hostname = "localhost"
listen_addr = "127.0.0.1"
listen_port = 6000

[btrfs_snapshot]
enable = true
snapshot_path = "/srv/publish"

[[mirrors]]
name = "debian"
provider = "rsync"
upstream = "rsync://ftp.debian.org/debian/"

[[mirrors]]
name = "elvish"
provider = "rsync"
upstream = "rsync://rsync.elv.sh/elvish/"
interval = 1440
snapshot_path = "/srv/publish/extra/elvish"
