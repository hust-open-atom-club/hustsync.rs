server {
    listen 80;

    root /srv/mirror;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location = /status.json {
        proxy_pass http://manager:14242/jobs;
    }

    location = / {
        proxy_pass http://web;
    }

    # Mirror trees come straight from disk; everything else is the site.
    location / {
        try_files $uri $uri/ @web;
    }

    location @web {
        proxy_pass http://web;
    }
}
