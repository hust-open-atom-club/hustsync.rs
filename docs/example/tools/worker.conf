[global]
name = "worker"
log_dir = "/var/log/hustsync/{{.Name}}"
mirror_dir = "/srv/mirror"
concurrent = 10
interval = 120

[manager]
api_base = "http://localhost:14242"

[server]
hostname = "localhost"
listen_addr = "127.0.0.1"
listen_port = 6000

[[mirrors]]
name = "debian"
provider = "fpsync"
upstream = "/mnt/nfs/debian"
fpsync_options = ["-n", "8", "-f", "20000"]

[[mirrors]]
name = "debian-edge"
provider = "lsyncd"
upstream = "edge::debian"
mirror_dir = "/srv/mirror/debian"
lsyncd_options = ["-delay", "5"]
